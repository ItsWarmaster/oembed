          https://biqapp.com/api/v1/video/oembed?url=https://cloud.biqapp.com/387214522072432640/Valorant_03-22-2024_23-3-21-702.mp4&format=json
      discovery: true
      notes:
        - >-
          Disabled on October 16, 2026: Endpoint or domain is unreachable (DNS
          or timeout error).
