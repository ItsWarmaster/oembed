- provider_name: Incredible
  provider_url: https://incredible.dev
  endpoints:
    - schemes:
        - https://incredible.dev/watch/*
      url: https://oembed.incredible.dev/oembed
      example_urls:
        - >-
          https://oembed.incredible.dev/oembed?url=https://incredible.dev/watch/md-to-video
      discovery: true
      formats:
        - json
      notes:
        - >-
          Disabled on September 10, 2026: Endpoint or domain is unreachable (DNS
          or timeout error).
