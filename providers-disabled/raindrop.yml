- provider_name: Raindrop
  provider_url: https://raindrop.io
  endpoints:
    - schemes:
        - https://raindrop.io/*
        - https://raindrop.io/*/*
        - https://raindrop.io/*/*/*
        - https://raindrop.io/*/*/*/*
      url: https://pub.raindrop.io/api/oembed
      example_urls:
        - >-
          https://pub.raindrop.io/api/oembed?url=https://raindrop.io/exentrich/design-66
      discovery: true
      formats:
        - json
      notes:
        - >-
          Disabled on September 10, 2026: Endpoint or domain is unreachable (DNS
          or timeout error).
